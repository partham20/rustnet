name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release -p tsr
      - name: Bundle tsr.exe with wintun.dll
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun
          New-Item -ItemType Directory dist-zip | Out-Null
          Copy-Item target/release/tsr.exe dist-zip/
          Copy-Item wintun/wintun/bin/amd64/wintun.dll dist-zip/
          Copy-Item README.md dist-zip/
          Compress-Archive dist-zip/* tsr-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tsr-windows-x86_64
          path: tsr-windows-x86_64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            tsr-windows-x86_64.zip
            target/release/tsr.exe
          body: |
            `tsr` for Windows x86_64. Unzip `tsr-windows-x86_64.zip` (it includes wintun.dll), then in an Administrator terminal:

            ```
            tsr.exe up --login-server http://<headscale>:8080 --auth-key <key>
            ```

            See the README for details and current limitations.
