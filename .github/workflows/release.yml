name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        default: v0.1.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch wintun.dll
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          $hash = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "wintun.zip sha256: $hash"
          if ($hash -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") { throw "unexpected wintun.zip hash" }
          Expand-Archive wintun.zip -DestinationPath wintun
          "TSR_WINTUN_DLL=$PWD\wintun\wintun\bin\amd64\wintun.dll" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: cargo test --workspace
      # TSR_WINTUN_DLL embeds the driver DLL, so tsr.exe works on its own.
      - run: cargo build --release -p tsr
      - name: Bundle tsr.exe with wintun.dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist-zip | Out-Null
          Copy-Item target/release/tsr.exe dist-zip/
          Copy-Item wintun/wintun/bin/amd64/wintun.dll dist-zip/
          Copy-Item README.md dist-zip/
          Compress-Archive dist-zip/* tsr-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tsr-windows-x86_64
          path: tsr-windows-x86_64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: tsr ${{ inputs.tag || github.ref_name }}
          files: |
            tsr-windows-x86_64.zip
            target/release/tsr.exe
          body: |
            `tsr` for Windows x86_64. `tsr.exe` works on its own (the Wintun driver DLL is built in); the zip adds the README. In an Administrator terminal:

            ```
            tsr.exe up --login-server http://<headscale>:8080 --auth-key <key>
            ```

            See the README for details and current limitations.
